            background-image: linear-gradient(to right, rgba(91, 33, 182, 0.05) 1px, transparent 1px),

        }

            box-shadow: 0px 12px 32px rgba(91, 33, 182, 0.08);
        }

        }

        .fill-1 {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
